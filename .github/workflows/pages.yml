name: Verify and publish Site Hub
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify generated reference cards
        run: |
          node tools/sync-product-rules-summary.mjs --check
          node tools/sync-bot-operating-rules-summary.mjs --check
          node tools/sync-tool-registry-summary.mjs --check
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/hub-qa" --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/hub-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify desktop and mobile Hub
        env:
          NODE_PATH: ${{ runner.temp }}/hub-qa/node_modules
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/hub-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          node tools/check-hub.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hub-browser-evidence
          path: qa-artifacts/
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Prepare public artifact
        run: |
          mkdir -p "$RUNNER_TEMP/hub-public"
          git archive HEAD .nojekyll README.md index.html analytics.html md.html metrika-report.html sanity-cms.html aimwebsite0.5 local-preview website-ops | tar -x -C "$RUNNER_TEMP/hub-public"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ runner.temp }}/hub-public
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
